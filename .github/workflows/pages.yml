name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and refresh official publications
        run: |
          python3 -m pip install 'lxml>=5,<7'
          curl --fail --location --retry 3 --max-time 90 -H 'Cache-Control: no-cache' \
            "https://dreamercs.github.io/central-banks-monitor/data/research-archive.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$RUNNER_TEMP/previous-archive.json"
          python3 scripts/update-map-activity.py --previous-archive "$RUNNER_TEMP/previous-archive.json"
      - name: Build the monthly research archive
        run: python3 scripts/build-research-archive.py
      - name: Index research notes
        run: python3 scripts/build-research-notes.py
      - name: Check requested coverage
        run: python3 scripts/check-data.py
      - name: Build official market event windows
        run: |
          python3 -m pip install 'openpyxl>=3.1,<4'
          curl --fail --location --retry 3 --max-time 90 https://www.frbsf.org/wp-content/uploads/USMPD.xlsx -o "$RUNNER_TEMP/usmpd.xlsx"
          curl --fail --location --retry 3 --max-time 90 https://www.ecb.europa.eu/pub/pdf/other/Dataset_EA-MPD.xlsx -o "$RUNNER_TEMP/ea-empd.xlsx"
          python3 scripts/build-market-events.py "$RUNNER_TEMP/usmpd.xlsx" "$RUNNER_TEMP/ea-empd.xlsx"
      - name: Refresh rates and FX history
        run: python3 scripts/update-market-history.py
      - name: Update daily Treasury benchmark
        run: python3 scripts/update-treasury.py
      - name: Refresh speaking calendar
        run: python3 scripts/update-speaking-calendar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
