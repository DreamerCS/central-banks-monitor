<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse central bank publications by month and jurisdiction.">
  <title>Publication Archive | Central Bank Intelligence</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="edition.css">
  <link rel="stylesheet" href="research-notes.css?v=6a3841fc8c2d">
  <link rel="stylesheet" href="research-archive.css?v=6a3841fc8c2d">
  <script src="publication-reader.js?v=6a3841fc8c2d" defer></script>
  <script src="research-archive.js?v=6a3841fc8c2d" defer></script>
</head>
<body class="archive-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="cbi-head"><div class="shell cbi-bar"><a class="cbi-name" href="./"><i aria-hidden="true"></i>Central Bank Intelligence</a><nav aria-label="Main navigation"><a href="./">Overview</a><a href="market-reactions.html">Market reactions</a><a href="historical-data.html">Policy history</a><a href="macro-history.html">Macro history</a><a href="research-notes.html">Research notes</a><a href="research-archive.html" aria-current="page">Archive</a></nav></div></header>
  <main class="shell archive-shell" id="main">
    <div class="archive-intro">
      <h1>Publication archive</h1>
      <a id="latest-publications" class="text-link" hidden></a>
    </div>
    <div id="archive-scope" class="archive-scope" role="group" aria-label="Publications to show" hidden>
      <button type="button" data-scope="analysis" aria-pressed="true">With analysis (<span id="analysis-count">0</span>)</button>
      <button type="button" data-scope="all" aria-pressed="false">All publications (<span id="all-count">0</span>)</button>
    </div>
    <nav id="archive-months" class="archive-months" aria-label="Archive months"></nav>
    <form id="archive-filters" class="archive-filters" aria-label="Filter publications" hidden>
      <label>Year <select id="year-filter"></select></label>
      <label>View <select id="view-filter"><option value="region">By region</option><option value="time">By time</option></select></label>
      <label>Jurisdiction <select id="bank-filter"></select></label>
      <label>Publication type <select id="type-filter"></select></label>
      <label>From <input id="from-filter" type="date" max="9999-12-31" aria-label="From date"></label>
      <label>To <input id="to-filter" type="date" max="9999-12-31" aria-label="To date"></label>
      <label>Search <input id="query-filter" type="search"></label>
      <button type="reset">Clear filters</button>
    </form>
    <p id="archive-results" class="archive-results" role="status">Loading publications…</p>
    <section id="archive-month" class="archive-month" aria-labelledby="active-month-title"></section>
    <button type="button" id="archive-more" hidden>Show more publications</button>
  </main>
  <dialog id="archive-reader" aria-label="Publication analysis">
    <div class="reader-toolbar"><span>Publication analysis</span><button type="button" id="close-analysis" autofocus>Close</button></div>
    <div class="reader-sheet">
      <p id="reader-status" role="status"></p>
      <article id="manuscript" aria-labelledby="note-title" hidden></article>
    </div>
  </dialog>
</body>
</html>
