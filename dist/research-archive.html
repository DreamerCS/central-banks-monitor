<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse central bank publications by month and jurisdiction.">
  <title>Monthly Publication Archive | Central Bank Intelligence</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="research-archive.css">
  <script src="research-archive.js?v=3" defer></script>
</head>
<body class="archive-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="shell archive-nav">
      <a href="./">Central Bank Intelligence</a>
      <nav aria-label="Main navigation"><a href="source-coverage.html">Source coverage</a><a href="historical-data.html">Historical data</a></nav>
    </div>
  </header>
  <main class="shell archive-shell" id="main">
    <div class="archive-intro">
      <h1>Monthly central bank archive</h1>
      <p>Decisions, speeches, minutes, forecasts and research across 29 jurisdictions.</p>
    </div>
    <nav id="archive-months" class="archive-months" aria-label="Archive months"></nav>
    <form id="archive-filters" class="archive-filters" aria-label="Filter publications" hidden>
      <label>View <select id="view-filter"><option value="region">By region</option><option value="time">By time</option></select></label>
      <label>Jurisdiction <select id="bank-filter"></select></label>
      <label>Publication type <select id="type-filter"></select></label>
      <label>Search <input id="query-filter" type="search"></label>
      <button type="reset">Clear filters</button>
    </form>
    <p id="archive-results" class="archive-results" role="status">Loading publications…</p>
    <section id="archive-month" class="archive-month" aria-labelledby="active-month-title"></section>
  </main>
</body>
</html>
