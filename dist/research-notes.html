<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19251e">
  <meta name="description" content="Research notes on central bank publications, with original sources and questions for further research.">
  <title>Research notes · Central Bank Intelligence</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="edition.css">
  <link rel="stylesheet" href="research-notes.css">
  <script defer src="research-notes.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="cbi-head"><div class="shell cbi-bar">
  <a class="cbi-name" href="./"><i aria-hidden="true"></i>Central Bank Intelligence</a>
  <nav aria-label="Main navigation"><a href="./">Overview</a><a href="market-reactions.html">Market reactions</a><a href="historical-data.html">Policy history</a><a href="research-notes.html" aria-current="page">Research notes</a><a href="research-archive.html">Archive</a></nav>
</div></header>
<main class="shell note-shell" id="main">
  <h1>Research notes</h1>
  <p id="note-status" role="status">Loading research notes…</p>
  <div id="note-layout" class="note-layout" hidden>
    <nav class="note-index" aria-label="Research note index">
      <label for="note-select" class="eyeline">Publication</label>
      <select id="note-select"></select>
      <ol id="note-index"></ol>
    </nav>
    <article id="manuscript" aria-labelledby="note-title">
      <div class="note-byline"><span id="note-bank"></span><time id="note-date"></time></div>
      <h2 id="note-title"></h2>
      <a id="note-source" class="note-source">Source document</a>
      <div id="note-summary"></div>
      <section class="note-questions"><h3>Questions for further research</h3><ol id="note-questions"></ol></section>
      <p class="note-limitation" id="note-limitation" hidden></p>
      <a class="note-permalink" id="note-permalink">Permalink</a>
    </article>
  </div>
</main>
</body>
</html>
